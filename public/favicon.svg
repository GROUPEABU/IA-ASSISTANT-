<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#0D273C"/>
  <defs>
    <radialGradient id="rf" cx="50%" cy="50%" r="65%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#93c5fd" stop-opacity="0.65"/>
      <stop offset="55%"  stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.06"/>
    </radialGradient>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#50E5E5"/>
    </linearGradient>
    <!-- glow layer -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ∞ centered at (16,16), r=7.5 → spans x=1–31, y=8.5–23.5 -->
  <!-- fill layer -->
  <path d="M 1 16 a 7.5 7.5 0 1 0 15 0 a 7.5 7.5 0 1 0 15 0 a 7.5 7.5 0 1 0 -15 0 a 7.5 7.5 0 1 0 -15 0"
        fill="url(#rf)"/>
  <!-- stroked + glowing outline -->
  <path d="M 1 16 a 7.5 7.5 0 1 0 15 0 a 7.5 7.5 0 1 0 15 0 a 7.5 7.5 0 1 0 -15 0 a 7.5 7.5 0 1 0 -15 0"
        stroke="url(#rg)" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"
        fill="none" filter="url(#glow)"/>
</svg>
