<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" fill="none">
  <rect width="200" height="40" rx="9" fill="#0D273C"/>
  <defs>
    <radialGradient id="rf" cx="50%" cy="50%" r="65%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#93c5fd" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.05"/>
    </radialGradient>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#50E5E5"/>
    </linearGradient>
  </defs>
  <!-- ∞ symbol — same path as Logo.jsx, scaled 0.5×, centered vertically -->
