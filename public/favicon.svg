<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#0D273C"/>
  <defs>
    <radialGradient id="rf" cx="50%" cy="50%" r="65%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#93c5fd" stop-opacity="0.65"/>
      <stop offset="55%"  stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.05"/>
    </radialGradient>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#50E5E5"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-40%" width="150%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!--
    Same path as Logo.jsx, scaled to fill x=5–27 / y=10.5–21.5 inside 32×32.
    scale=0.611  →  translate(-3.55, 5) scale(0.611)
    verified: left=5, right=27 (5px margins), top=10.5, bottom=21.5 (10.5px margins)
  -->
  <g transform="translate(-3.55,5) scale(0.611)">
    <path d="M 14 18 a 9 9 0 1 0 18 0 a 9 9 0 1 0 18 0 a 9 9 0 1 0 -18 0 a 9 9 0 1 0 -18 0"
          fill="url(#rf)" stroke="none"/>
    <path d="M 14 18 a 9 9 0 1 0 18 0 a 9 9 0 1 0 18 0 a 9 9 0 1 0 -18 0 a 9 9 0 1 0 -18 0"
          stroke="url(#rg)" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"
          fill="none" filter="url(#glow)"/>
  </g>
</svg>
