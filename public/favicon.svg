    <path d="M 14 18 a 9 9 0 1 0 18 0 a 9 9 0 1 0 18 0 a 9 9 0 1 0 -18 0 a 9 9 0 1 0 -18 0"
          fill="url(#rf)" stroke="none"/>
    <path d="M 14 18 a 9 9 0 1 0 18 0 a 9 9 0 1 0 18 0 a 9 9 0 1 0 -18 0 a 9 9 0 1 0 -18 0"
          stroke="url(#rg)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- "Autobuyunion" wordmark -->
  <text x="34" y="27"
        font-family="Poppins,'Segoe UI',system-ui,sans-serif"
        font-size="18" font-weight="600"
        fill="#E0E1E1" letter-spacing="-0.4">Autobuyunion</text>
